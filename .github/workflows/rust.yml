name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install pinned Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Test workspace
        run: cargo +1.98.1 test --workspace --locked
      - name: Run Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
